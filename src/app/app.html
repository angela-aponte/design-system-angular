<main class="app">
  <h1>Mini Design System</h1>
  <p class="sub">Componentes reutilizables construidos con Angular.</p>

  <section>
    <h2>Botones</h2>
    <div class="fila">
      <ds-boton>Primario</ds-boton>
      <ds-boton variante="secundario">Secundario</ds-boton>
      <ds-boton variante="peligro">Peligro</ds-boton>
    </div>
  </section>

  <section>
    <h2>Alertas</h2>
    <div class="columna">
      <ds-alerta>Esto es un mensaje informativo.</ds-alerta>
      <ds-alerta tipo="exito">La operación se realizó con éxito.</ds-alerta>
      <ds-alerta tipo="error">Ocurrió un error inesperado.</ds-alerta>
    </div>
  </section>

  <section>
    <h2>Insignias</h2>
    <div class="fila">
      <ds-insignia>Nuevo</ds-insignia>
      <ds-insignia color="verde">Activo</ds-insignia>
      <ds-insignia color="rojo">Urgente</ds-insignia>
    </div>
  </section>
</main>
